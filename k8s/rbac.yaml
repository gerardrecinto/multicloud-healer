apiVersion: v1
kind: ServiceAccount
metadata:
  name: multicloud-healer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multicloud-healer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multicloud-healer
subjects:
  - kind: ServiceAccount
    name: multicloud-healer
    namespace: default
roleRef:
  kind: ClusterRole
  name: multicloud-healer
  apiGroup: rbac.authorization.k8s.io
